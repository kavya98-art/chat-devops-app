<!DOCTYPE html>
<html>
<head>
  <title>Chat App</title>
</head>
<body>

<h2>Chat App</h2>

<input id="msg" placeholder="Type message">
<button onclick="send()">Send</button>

<p id="output"></p>

<script>
function send() {
  document.getElementById("output").innerText =
    "You typed: " + document.getElementById("msg").value;
}
</script>

</body>
</html>
